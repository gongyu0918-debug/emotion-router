name: Skill v2 gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Markdown skill audit
        run: python -B scripts/markdown_skill_audit.py
      - name: Published bundle allowlist
        run: python -B scripts/bundle_manifest_check.py
      - name: Bundle staging safety
        run: python -B scripts/bundle_manifest_safety_test.py
      - name: Marketplace metadata audit
        run: python -B scripts/marketplace_tag_audit.py
